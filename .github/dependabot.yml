version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Matches the 14-day minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 14
    # Major upgrades (TypeScript, Vitest, React...) need a real migration; do them by hand.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
