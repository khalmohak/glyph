name: GitHub Pages redirect

# The docs and demos moved to Cloudflare (glyphui.xyz; see cloudflare.yml). This keeps the old
# khalmohak.github.io/glyph links working by redirecting every path to its new address.
on:
  push:
    branches: [main]
    paths: ['.github/pages-redirect/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site
          cp .github/pages-redirect/index.html site/index.html
          cp .github/pages-redirect/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
