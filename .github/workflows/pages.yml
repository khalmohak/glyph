name: Docs and showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=docs --filter=showcase
        env:
          DOCS_BASE: /glyph/
      # Docs at /glyph/, showcase at /glyph/showcase/. 404.html lets deep links load the SPA.
      - run: |
          mkdir -p site
          cp -R apps/docs/dist/. site/
          cp site/index.html site/404.html
          mkdir -p site/showcase
          cp -R apps/showcase/dist/. site/showcase/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
