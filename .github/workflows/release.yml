name: Release

# On every push to main, Changesets either opens/updates a "Release packages" PR
# (when there are pending changesets) or, once that PR is merged, runs `pnpm release`:
# build, verify exports, publish unpublished versions with provenance, tag, and
# create a GitHub release per package from the changelog.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance and trusted publishing

jobs:
  release:
    if: github.repository == 'khalmohak/glyph'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # No typecheck/test here: CI's `check` job already runs them on every PR and push to main.
      # `pnpm release` still builds the packages and verifies their exports before publishing.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not needed once npm trusted publishing is configured for both packages.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
