name: Release

# On every push to main, Changesets either opens/updates a "Release packages" PR
# (when there are pending changesets) or, once that PR is merged, runs `pnpm release`:
# build, verify exports, publish unpublished versions with provenance, tag, and
# create a GitHub release per package from the changelog.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance and trusted publishing

jobs:
  release:
    if: github.repository == 'khalmohak/glyph'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # No typecheck/test here: CI's `check` job already runs them on every PR and push to main.
      # `pnpm release` still builds the packages and verifies their exports before publishing.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not needed once npm trusted publishing is configured for both packages.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # List @glyphui/mcp in the official MCP Registry (registry.modelcontextprotocol.io) whenever
      # a new version reaches npm. GitHub OIDC proves ownership of the io.github.khalmohak/
      # namespace (needs id-token: write); the registry checks npm for the package's `mcpName`.
      - name: Publish to the MCP Registry
        if: steps.changesets.outputs.published == 'true' && contains(steps.changesets.outputs.publishedPackages, '"@glyphui/mcp"')
        working-directory: packages/mcp
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # npm can take a minute to serve a just-published version, so retry a few times.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $attempt failed; retrying in 30s."
            sleep 30
          done
          exit 1
