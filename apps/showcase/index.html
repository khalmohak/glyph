<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Glyph Showcase</title>
    <meta name="description" content="One theme file, every screen follows. A React + Tailwind CSS component library." />
    <!-- Sets data-mode before first paint (from getColorModeScript). Also honors a host page's data-theme. -->
    <script>
      ;(() => {
        const root = document.documentElement
        const valid = (m) => m === 'light' || m === 'dark' || m === 'system'
        let mode = null
        try {
          mode = new URLSearchParams(location.search).get('mode') || localStorage.getItem('glyph-mode')
        } catch {}
        if (!valid(mode)) {
          const host = root.getAttribute('data-theme')
          mode = host === 'light' || host === 'dark' ? host : 'dark'
        }
        if (mode === 'system') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        root.dataset.mode = mode
        root.style.colorScheme = mode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
